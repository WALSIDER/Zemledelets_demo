<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Земледелецъ — Материал</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/news-detail-ads.css" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="listing_single news_article_layout">
      <div class="content_panel news_detail_panel" id="news-detail-main">
        <div class="mini_box status_message">Открываем материал...</div>
      </div>
      <aside class="news_ad_sidebar" aria-label="Рекламные предложения">
        <a class="news_ad news_ad--equipment" href="marketplace.html">
          <div class="news_ad_copy">
            <div class="news_ad_label"><span>Земледелецъ</span><span>Реклама</span></div>
            <h2>Всё для работы<br>в поле</h2>
            <p>Техника, запчасти и сервисные услуги для вашего хозяйства.</p>
            <span class="news_ad_action">Смотреть предложения <span aria-hidden="true">↗</span></span>
          </div>
          <img src="/assets/img/listing-tech.svg" alt="" width="300" height="130" />
        </a>
        <a class="news_ad news_ad--partners" href="companies.html">
          <div class="news_ad_copy">
            <div class="news_ad_label"><span>Земледелецъ</span><span>Реклама</span></div>
            <h2>Ваш следующий<br>деловой партнёр</h2>
            <p>Производители, поставщики и сервисные компании в одном каталоге.</p>
            <span class="news_ad_action">Найти компанию <span aria-hidden="true">↗</span></span>
          </div>
          <img src="/assets/img/listing-seeds.svg" alt="" width="300" height="130" />
        </a>
      </aside>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/assets/js/app.js"></script>
</body>
</html>
